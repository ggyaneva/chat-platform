<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Room</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<header>
    <button onclick="window.history.back()" aria-label="Go Back">Back</button>
</header>
<main>
    <h2 id="room-name" aria-live="polite">Chat Room</h2>
    <section id="messages" aria-label="Messages"></section>
    <label for="message-input">Type a message</label>
    <input type="text" id="message-input" placeholder="Type a message..." aria-label="Message Input">
    <button id="send-message" aria-label="Send Message">Send</button>
</main>
<script src="/js/websocket.js"></script>
</body>
</html>
