<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="auth-container">
    <div class="auth-card">
        <h2>Sign In</h2>
        <form id="signin-form" class="auth-form" aria-label="Sign In Form">
            <label for="signin-username">Username:</label>
            <input type="text" id="signin-username" name="username" placeholder="Username" required aria-required="true">
            <label for="signin-password">Password:</label>
            <input type="password" id="signin-password" name="password" placeholder="Password" required aria-required="true">
            <button type="submit" aria-label="Sign In">Sign In</button>
        </form>
        <div class="auth-links">
            <a href="/register" aria-label="Go to Register">Don't have an account? Register</a>
        </div>
        <div id="signin-success-message" class="success-message" aria-live="polite"></div>
        <div id="signin-error-message" class="error-message" aria-live="assertive"></div>
    </div>
</div>
<script src="/js/signin.js"></script>
</body>
</html>
